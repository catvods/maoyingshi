name: moyingshi_flutter
description: "Mooyingshi Flutter module (B8 C0 shell). Hand-written equivalent of `flutter create -t module` output; see docs/b8-c0-shell.md."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  # Flutter 3.50 formally deprecates package:flutter/material.dart; the
  # Material library is now the standalone material_ui package. Pinned
  # exactly like Pigeon below: C0 keeps every Dart dependency reproducible.
  material_ui: 1.11.0
  # Remote Flutter Widgets: renders the ported PeekPro home themes
  # (declarative home layouts in assets/peek_home, driven by the
  # B11/B12 home data through the peek.home local widget library).
  rfw: ^1.1.1

dev_dependencies:
  # Pinned exactly, no caret: both sides of a Pigeon channel must be
  # generated with the same Pigeon version (pigeon README). CI generates
  # both sides in one `dart run pigeon` invocation.
  pigeon: 30.0.2

flutter:
  # Required: bundles the MaterialIcons font. Without it every Icon()
  # renders as a tofu box. The module uses 70+ Icons.* sites via
  # material_ui, and material_ui 1.11.0 declares no fonts of its own
  # (its pubspec only lists shaders), so the app module must opt in.
  # Missing since the C0 shell's hand-written pubspec; first visible
  # on the icon-heavy B7/B11/B21 screens in joint build #40.
  uses-material-design: true
  assets:
    - assets/peek_home/
  # Title fonts are NO LONGER bundled here: NotoSerifSC (serif) and
  # LXGWWenKaiLite (wenkai) ship in the 「标题字体」 module zip instead
  # (ModuleDefinition.FONTS; packaged by app/build.gradle from
  # assets/fonts/ below) and are registered at runtime via FontLoader
  # (flutter_module/lib/title_font_loader.dart) when a theme asks for
  # them. The .ttf files stay in this repo as the packaging source;
  # both are SIL Open Font License 1.1 — see assets/fonts/FONTS_LICENSE.md.
  # Unbundling them drops ~23 MB from the base APK; a theme whose
  # title font is serif/wenkai falls back to the system font until
  # the module is downloaded.
  module:
    androidX: true
    androidPackage: com.github.maoyingshi.osc.tv.flutter
    iosBundleIdentifier: com.github.maoyingshi.osc.tv.flutter
